name: Voltline
options:
  minimumXcodeGenVersion: 2.44.1
settings:
  base:
    SWIFT_VERSION: 6.2
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: 26.0
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.moritz.voltline
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_CFBundleDisplayName: Voltline
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    ENABLE_APP_SANDBOX: false
    ENABLE_HARDENED_RUNTIME: true
targets:
  Voltline:
    type: application
    platform: macOS
    sources:
      - Voltline
    settings:
      base:
        PRODUCT_NAME: Voltline
        PRODUCT_MODULE_NAME: Voltline
        CODE_SIGN_ENTITLEMENTS: Voltline/Voltline.entitlements
    scheme: {}

