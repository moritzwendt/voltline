name: Voltline
options:
  minimumXcodeGenVersion: 2.44.1
settings:
  base:
    SWIFT_VERSION: 6.2
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: 26.0
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.moritz.voltline
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_CFBundleDisplayName: Voltline
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Voltline reads battery levels from connected devices.
    ENABLE_APP_SANDBOX: false
    ENABLE_HARDENED_RUNTIME: true
targets:
  Voltline:
    type: application
    platform: macOS
    sources:
      - Voltline
    dependencies:
      - sdk: IOKit.framework
      - sdk: Charts.framework
      - sdk: SwiftData.framework
      - sdk: ServiceManagement.framework
      - sdk: IOBluetooth.framework
      - sdk: CoreBluetooth.framework
      - sdk: UserNotifications.framework
    settings:
      base:
        PRODUCT_NAME: Voltline
        PRODUCT_MODULE_NAME: Voltline
        CODE_SIGN_ENTITLEMENTS: Voltline/Voltline.entitlements
    scheme:
      testTargets:
        - VoltlineTests
  VoltlineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - VoltlineTests
    dependencies:
      - target: Voltline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moritz.voltline.tests
        GENERATE_INFOPLIST_FILE: true
